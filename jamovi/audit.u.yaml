name: audit
title: Data Check
jus: '3.0'
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables to check
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: ID variable (optional)
        children:
          - type: VariablesListBox
            name: id
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Other columns to keep in the new dataset (unchanged)
        children:
          - type: VariablesListBox
            name: keep
            isTarget: true
  - type: Label
    label: 'Step 1: Report (also show)'
    children:
      - type: CheckBox
        name: showCharts
      - type: CheckBox
        name: showMissing
      - type: CheckBox
        name: showCorr
  - type: Label
    label: 'Step 2: Decide what each value becomes'
    stretchFactor: 1
    children:
      - type: ListBox
        name: fixes
        showColumnHeaders: true
        fullRowSelect: true
        stretchFactor: 1
        height: largest
        columns:
          - name: head
            label: Variable
            selectable: false
            stretchFactor: 0.8
            template:
              type: TextBox
              label: ''
              format: string
              enable: false
          - name: value
            label: Value in data
            selectable: false
            stretchFactor: 1
            template:
              type: TextBox
              label: ''
              format: string
              enable: false
          - name: to
            label: Becomes
            selectable: false
            stretchFactor: 1
            template:
              type: TextBox
              label: ''
              format: string
  - type: Label
    label: 'Step 3: Create the cleaned data'
    children:
      - type: Output
        name: cleanOV
  - type: Label
    label: 'Or make a new, separate dataset'
    children:
      - type: CheckBox
        name: allCols
      - type: CheckBox
        name: tidyNames
      - type: CheckBox
        name: dropAdmin
      - type: CheckBox
        name: dropDup
      - type: CheckBox
        name: dropEmpty
      - type: ActionButton
        name: openData
      - type: ActionButton
        name: exportData
